# Builds the Shono APKs on GitHub's machines (the Windows PC has no Java or Android SDK). Runs on every push to the
# `android` branch, or from the Actions tab; the APKs are attached to the run.
#   Shono-dev-*.apk      development build: the app's code comes live from `npx expo start` on the PC
#   Shono-preview-*.apk  code built in, signed with the debug key: for testing only (releases get the real key later)
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [android]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # The device photos and logo are the maker's artwork, kept off GitHub: they come from repository secrets. Without
      # the secrets the build still works, with blank pictures in their place.
      - name: Device photos
        env:
          PHOTO_LEFT: ${{ secrets.SHONO_PHOTO_LEFT }}
          PHOTO_RIGHT: ${{ secrets.SHONO_PHOTO_RIGHT }}
          PHOTO_CASE: ${{ secrets.SHONO_PHOTO_CASE }}
          PHOTO_CASE_PLAIN: ${{ secrets.SHONO_PHOTO_CASE_PLAIN }}
          LOGO_HOCO: ${{ secrets.SHONO_LOGO_HOCO }}
        run: |
          set -euo pipefail
          BLANK_WEBP=UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==
          BLANK_PNG=iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
          put() { # secret value, fallback, file
            if [ -n "$1" ]; then echo "$1" | base64 -d > "$3"; else echo "::warning::$3 is blank (its secret isn't set)"; echo "$2" | base64 -d > "$3"; fi
          }
          mkdir -p public/device-photos/eq35/hd
          put "$PHOTO_LEFT" "$BLANK_WEBP" public/device-photos/eq35/hd/left.webp
          put "$PHOTO_RIGHT" "$BLANK_WEBP" public/device-photos/eq35/hd/right.webp
          put "$PHOTO_CASE" "$BLANK_WEBP" public/device-photos/eq35/hd/case.webp
          put "$PHOTO_CASE_PLAIN" "$BLANK_WEBP" public/device-photos/eq35/hd/case-plain.webp
          put "$LOGO_HOCO" "$BLANK_PNG" public/device-photos/hoco-logo.png

      # The native project from app.json and the plugins, as EAS makes it.
      - run: npx expo prebuild --platform android --no-install

      # 64-bit ARM only (every current phone): half the build time and size
      - name: Build the APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name them
        run: |
          set -euo pipefail
          V=$(node -p "require('./app.json').expo.version")
          C=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "Shono-dev-$V-$C.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "Shono-preview-$V-$C.apk"
          ls -la Shono-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shono-apk
          path: Shono-*.apk
          if-no-files-found: error
